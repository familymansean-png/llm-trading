name: trading-cycle
# LLM Trading Study — decision cycles on GitHub Actions.
# GitHub's cron scheduler is best-effort (often ~hourly despite */15), so each
# run executes 4 cycles internally at 15-minute spacing for true 15-min cadence.

on:
  schedule:
    - cron: "7 * * * *"      # hourly trigger; 4 internal cycles = every ~15 min
  workflow_dispatch: {}       # manual trigger for testing

concurrency:
  group: trading
  cancel-in-progress: false   # never kill a cycle mid-order; late runs queue

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run 4 decision cycles, 15 min apart
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            echo "=== cycle $i of 4 ==="
            python harness/trader.py || echo "cycle $i errored; continuing"
            git add logs/
            if ! git diff --cached --quiet; then
              git commit -m "cycle $(date -u +%Y-%m-%dT%H:%M)"
              git pull --rebase origin main || true
              git push || true
            fi
            if [ "$i" -lt 4 ]; then sleep 780; fi
          done
